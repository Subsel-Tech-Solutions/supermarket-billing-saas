server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 20m;

    # Hashed bundles never change under the same name
    location /static/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # index.html, the manifest and the icons must revalidate, or a till keeps booting
    # yesterday's JavaScript after a deploy.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }
    location = /manifest.json {
        add_header Cache-Control "no-cache";
    }

    # Keep the worker script fresh after deploys and let it control the app root.
    location = /service-worker.js {
        add_header Cache-Control "no-cache";
        add_header Service-Worker-Allowed "/";
        try_files $uri =404;
    }

    # React SPA fallback
    location / {
        try_files $uri $uri/ /index.html;
    }

    location /api {
        proxy_pass http://backend:5000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # Express reads X-Forwarded-For (with `trust proxy` set) to get the real client
        # address. Without it every request looks like it came from nginx, so the login
        # rate limiter would count the whole shop as one attacker — and lock everyone out.
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        # A bulk product import of a few thousand rows takes a while
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }
}
