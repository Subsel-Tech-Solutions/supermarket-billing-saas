services:
  mysql:
    image: mysql:8.0
    container_name: supermart_db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-prootpassword"]
      interval: 10s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: supermart_backend
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      PORT: 5000
      NODE_ENV: production
      DB_HOST: mysql
      DB_PORT: 3306
      # root is used because the app creates one database per business
      DB_USER: root
      DB_PASSWORD: rootpassword
      DB_NAME: supermart_master
      TENANT_DB_PREFIX: sm_shop_
      # Local-only default so `docker compose up` works out of the box. Override it in a
      # .env file before exposing this to a network — the server refuses to start in
      # production if it still looks like an example value.
      JWT_SECRET: ${JWT_SECRET:-local_dev_only_jwt_secret_change_me_0123456789abcdef}
      JWT_EXPIRES_IN: 7d
      # nginx sits in front, so read the client IP from X-Forwarded-For
      TRUST_PROXY: "true"
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@supermarket.com}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-admin123}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      EMAIL_FROM: ${EMAIL_FROM:-}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:3000}
    ports:
      - "5000:5000"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: supermart_frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "3000:80"

volumes:
  mysql_data:
